[project]
name = "cloud-dog-jobs"
version = "0.1.0"
description = "PS-75 Job & Queue Management for Cloud-Dog services"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
config = ["cloud-dog-config>=0.1.0"]
logging = ["cloud-dog-logging>=0.1.0"]
idam = ["cloud-dog-idam>=0.1.0"]
redis = ["redis>=5.0"]
alembic = ["alembic>=1.13"]
fastapi = ["fastapi>=0.110"]
otel = ["opentelemetry-api>=1.20"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
